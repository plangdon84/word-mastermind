<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A free word game: find the secret 5-letter word from how many letters each guess shares with it. Play alone, against the computer or a friend, or race the clock in Rush." />
    <meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mastermind" />
    <title>Word Mastermind</title>
    <!-- Search engines and link previews (Dev Plan item 18j): one address, wordmastermind.app. -->
    <link rel="canonical" href="https://wordmastermind.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Word Mastermind" />
    <meta property="og:title" content="Word Mastermind" />
    <meta property="og:description" content="A free word game: find the secret 5-letter word from how many letters each guess shares with it. Play alone, against the computer or a friend, or race the clock in Rush." />
    <meta property="og:url" content="https://wordmastermind.app/" />
    <meta property="og:image" content="https://wordmastermind.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Word Mastermind logo beside a sample guess, CRANE, scoring 2." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Word Mastermind" />
    <meta name="twitter:description" content="A free word game: find the secret 5-letter word from how many letters each guess shares with it." />
    <meta name="twitter:image" content="https://wordmastermind.app/og-image.png" />
    <!-- Structured data for search engines: a data block, never run as a script. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["VideoGame", "WebApplication"],
        "name": "Word Mastermind",
        "url": "https://wordmastermind.app/",
        "description": "A free word game: find the secret 5-letter word from how many letters each guess shares with it. Play alone, against the computer or a friend, or race the clock in Rush.",
        "image": "https://wordmastermind.app/og-image.png",
        "applicationCategory": "GameApplication",
        "genre": ["Word game", "Puzzle"],
        "operatingSystem": "Any (in a web browser)",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "author": { "@type": "Person", "name": "Paul Langdon" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
